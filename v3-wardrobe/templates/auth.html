{% extends "base.html" %}
{% block title %}{{ '注册' if mode=='register' else '登录' }} - AI 智能衣橱{% endblock %}
{% block body %}
<div class="card center">
  <div class="logo">👗</div>
  <div class="title">AI 智能衣橱</div>
  <p class="muted" style="margin-bottom:24px">记录你的每一件衣服，让豆包帮你搭出好品味</p>
  <form method="post">
    <input type="text" name="username" placeholder="用户名" required style="margin-bottom:12px">
    <input type="password" name="password" placeholder="密码（至少 6 位）" required>
    <button class="btn">{{ '注册账号' if mode=='register' else '登录' }}</button>
  </form>
  {% if mode=='login' %}
    <p class="hint">还没有账号？<a href="{{ url_for('register') }}">去注册</a></p>
  {% else %}
    <p class="hint">已有账号？<a href="{{ url_for('login') }}">去登录</a></p>
  {% endif %}
</div>
{% endblock %}
